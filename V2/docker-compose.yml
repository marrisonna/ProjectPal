services:
  db:
    image: postgres:16
    container_name: projectpal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectpal}
      POSTGRES_USER: ${POSTGRES_USER:-projectpal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}
    ports:
      # Bound to localhost only — never publish this to 0.0.0.0. Per
      # DataBaseHostingOptions.md, nothing outside this machine's own API layer
      # (not built yet) should ever talk to PostgreSQL directly.
      - "127.0.0.1:5432:5432"
    volumes:
      - projectpal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectpal} -d ${POSTGRES_DB:-projectpal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest-api:
    build: ./rest-api
    container_name: projectpal-rest-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-projectpal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-projectpal}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting}
      # Optional — defaults to 8 hours (28800s) in app/config.py if unset here too;
      # the default is repeated here so it's always a real number, never empty
      # (3_Authentication/Plan.md D1.3-6).
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-28800}
    ports:
      # Bound to localhost only, same principle as the db service above — the
      # eventual reverse proxy (Claude/Level1_Implementation/4_HttpsReverseProxy)
      # is what actually faces anything beyond this machine.
      - "127.0.0.1:8000:8000"

volumes:
  projectpal-db-data:
